<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IceTube</title>
<style>
:root{--bg:#0f0f0f;--c:#212121;--t:#f1f1f1;--m:#aaa;--r:#f03;--b:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:var(--t)}
button{background:var(--c);border:0;border-radius:18px;padding:8px 14px;cursor:pointer}button:hover{background:#3a3a3a}
button.p{background:var(--r)}button.on{background:#fff;color:#000}
input,select,textarea{background:#121212;border:1px solid var(--b);border-radius:8px;padding:8px;width:100%;margin:4px 0 10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--b);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px}.logo b{background:var(--r);padding:2px 8px;border-radius:6px;margin-right:4px}
#q{max-width:420px;flex:1;margin:0;border-radius:20px}
.wrap{display:flex}nav{width:190px;padding:10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;flex:none}
nav a{display:block;padding:10px 12px;border-radius:10px}nav a:hover,nav a.on{background:var(--c)}
main{flex:1;padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{cursor:pointer}.th{aspect-ratio:16/9;border-radius:12px;background:#222 center/cover;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px}
.tag{position:absolute;right:6px;bottom:6px;background:#000c;padding:2px 6px;border-radius:4px;font-size:11px}
.card h4{margin:8px 0 2px;font-size:14px}.m{color:var(--m);font-size:12px}
.watch{display:grid;grid-template-columns:1fr 340px;gap:20px}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
.player iframe,.player video{width:100%;height:100%;border:0}
.ad{position:absolute;inset:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:2;text-align:center;padding:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:10px}
.box{background:var(--c);border-radius:14px;padding:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.cm{display:flex;gap:10px;margin:12px 0}.av{width:36px;height:36px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stat{background:var(--c);border-radius:12px;padding:14px;display:inline-block;min-width:150px;margin:0 8px 8px 0}.stat b{font-size:22px;display:block}
@media(max-width:800px){nav{display:none}.watch{grid-template-columns:1fr}}
</style></head><body>
<header>
<a href="#home" class="logo"><b>Ice</b>Tube</a>
<input id="q" placeholder="Cari video..." onkeydown="if(event.key==='Enter')location.hash='s-'+encodeURIComponent(this.value)">
<button onclick="openAdd()">🔗 Tambah Link</button>
<button class="p" onclick="openUp()">⬆ Upload</button>
<button onclick="openSet()">⚙</button>
</header>
<div class="wrap"><nav id="nav"></nav><main id="app"></main></div>
<div id="md"></div>

<script>
/* ===== KONFIGURASI ===== */
const MY_HANDLE='IceChikurinGaming';
const MY_YT='https://www.youtube.com/@IceChikurinGaming';
// Tempel kode iklan asli (AdSense/jaringan iklan lain) di sini. Contoh: '<ins class="adsbygoogle" ...></ins>'
// CATATAN: 241-215-1380 adalah format ID akun Google Ads (untuk pengiklan), bukan ID penerbit AdSense (ca-pub-xxxx) yang dipakai untuk MENDAPAT uang.
const AD_HTML='';
const AD_SECONDS=5, REWARD_PER_AD=25; // Rp per iklan selesai (simulasi)

/* ===== DATA ===== */
let db=JSON.parse(localStorage.getItem('icetube')||'null')||{
  user:'Pengguna',key:'',ytId:'',cur:'c1',
  ch:[{id:'c1',name:'IceChikurinGaming',desc:'Channel gaming',yt:MY_YT,subs:0}],
  vid:[],rx:{},cm:{},sub:{},earn:{}};
let cache={}; // video YouTube dari API (sementara)
const save=()=>localStorage.setItem('icetube',JSON.stringify(db));
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const idb=new Promise(r=>{const q=indexedDB.open('icetube',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result)});
const idbp=async(m,k,v)=>{const d=await idb;return new Promise(r=>{const s=d.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f');const q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result)})};
const allVids=()=>[...db.vid,...Object.values(cache)];
const getV=id=>allVids().find(v=>v.id===id);
const chOf=id=>db.ch.find(c=>c.id===id);

/* ===== PARSER LINK ===== */
function parse(u){u=u.trim();let m;
 if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/))return{p:'youtube',ref:m[1]};
 if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return{p:'tiktok',ref:m[1]};
 if(m=u.match(/instagram\.com\/(p|reel|tv)\/([\w-]+)/))return{p:'instagram',ref:m[1]+'/'+m[2]};
 if(m=u.match(/dailymotion\.com\/video\/([\w]+)|dai\.ly\/([\w]+)/))return{p:'dailymotion',ref:m[1]||m[2]};
 return null}
function embed(v){const r=v.ref;return{
 youtube:`https://www.youtube-nocookie.com/embed/${r}?autoplay=1`,
 tiktok:`https://www.tiktok.com/embed/v2/${r}`,
 instagram:`https://www.instagram.com/${r}/embed`,
 dailymotion:`https://www.dailymotion.com/embed/video/${r}?autoplay=1`}[v.p]}
const ICON={web:'🎬',youtube:'▶️',tiktok:'🎵',instagram:'📷',dailymotion:'🅳'};
function thumb(v){if(v.img)return v.img;
 if(v.p==='youtube')return`https://i.ytimg.com/vi/${v.ref}/hqdefault.jpg`;
 if(v.p==='dailymotion')return`https://www.dailymotion.com/thumbnail/video/${v.ref}`;return''}
function card(v){const t=thumb(v);return`<div class="card" onclick="location.hash='w-${v.id}'">
<div class="th" style="${t?`background-image:url('${esc(t)}')`:'background:linear-gradient(135deg,#333,#111)'}">${t?'':ICON[v.p]}<span class="tag">${v.p}</span></div>
<h4>${esc(v.title)}</h4><div class="m">${esc(v.chName||chOf(v.ch)?.name||v.p)} • ${v.views||0}x ditonton</div></div>`}

/* ===== API YOUTUBE (opsional, butuh API key) ===== */
async function yt(path){const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'&key='+db.key);const j=await r.json();if(j.error)throw new Error(j.error.message);return j}
function addYT(items,tag){return items.map(i=>{const ref=i.id?.videoId||i.contentDetails?.videoId||i.snippet?.resourceId?.videoId||i.id;
 const v={id:'yt_'+ref,p:'youtube',ref,title:i.snippet.title,chName:i.snippet.channelTitle,views:0,tag};cache[v.id]=v;return v})}
async function myYT(){if(!db.key)return[];
 const c=await yt('channels?part=contentDetails&'+(db.ytId?'id='+db.ytId:'forHandle='+MY_HANDLE));
 const up=c.items[0].contentDetails.relatedPlaylists.uploads;
 return addYT((await yt('playlistItems?part=snippet&maxResults=50&playlistId='+up)).items,'mine')}
const trending=async()=>db.key?addYT((await yt('videos?part=snippet&chart=mostPopular&regionCode=ID&maxResults=24')).items):[];
const search=async q=>db.key?addYT((await yt('search?part=snippet&type=video&maxResults=24&q='+encodeURIComponent(q))).items):[];

/* ===== ROUTER ===== */
const NAV=[['home','🏠 Beranda'],['p-web','🎬 Video IceTube'],['p-youtube','▶️ YouTube'],['p-tiktok','🎵 TikTok'],['p-instagram','📷 Instagram'],['p-dailymotion','🅳 Dailymotion'],['mych','📺 Channel Saya'],['earn','💰 Penghasilan']];
async function route(){const h=location.hash.slice(1)||'home';const i=h.indexOf('-');const a=i<0?h:h.slice(0,i),b=i<0?'':decodeURIComponent(h.slice(i+1));
 $('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===h?'on':''}">${l}</a>`).join('');
 const app=$('#app');window.scrollTo(0,0);
 try{
 if(a==='home'){app.innerHTML=`<h2>Beranda</h2><div class="m">Memuat...</div>`;
  const mine=await myYT().catch(e=>(app.dataset.err=e.message,[]));const tr=await trending().catch(()=>[]);
  app.innerHTML=`<h2>Video IceTube & Link Tersimpan</h2>${grid(db.vid)}
  <h2>Video Channel Saya (${esc(MY_HANDLE)})</h2>${mine.length?grid(mine):ytEmbedMine()}
  ${tr.length?`<h2>Trending YouTube</h2>${grid(tr)}`:''}`}
 else if(a==='p'){const l=b==='youtube'?[...await myYT().catch(()=>[]),...await trending().catch(()=>[]),...db.vid.filter(v=>v.p==='youtube')]:db.vid.filter(v=>v.p===b);
  app.innerHTML=`<h2>${ICON[b]} ${b}</h2>${b==='youtube'&&!db.key?ytEmbedMine():''}${grid(l)}`}
 else if(a==='s'){app.innerHTML=`<h2>Hasil: ${esc(b)}</h2>`+grid([...db.vid.filter(v=>(v.title+v.chName).toLowerCase().includes(b.toLowerCase())),...await search(b).catch(()=>[])])}
 else if(a==='w')await watch(b);
 else if(a==='ch')chPage(b);
 else if(a==='mych')chPage(db.cur);
 else if(a==='earn')earnPage();
 }catch(e){app.innerHTML='<p>Error: '+esc(e.message)+'</p>'}}
const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="m">Belum ada video. Klik "Upload" atau "Tambah Link".</p>';
function ytEmbedMine(){return db.ytId?`<div class="player" style="max-width:800px"><iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=UU${db.ytId.slice(2)}" allowfullscreen></iframe></div>`:
 `<p class="m">Untuk menampilkan SEMUA video channel kamu dan trending YouTube: buka ⚙ Pengaturan, isi <b>YouTube API key</b> (gratis dari Google Cloud) atau minimal <b>Channel ID</b> (UC...). <a href="${MY_YT}" target="_blank" style="color:#6cf">Buka channel</a></p>`}
addEventListener('hashchange',route);

/* ===== HALAMAN TONTON ===== */
let adTimer;
async function watch(id){const v=getV(id);if(!v){$('#app').innerHTML='Video tidak ditemukan';return}
 v.views=(v.views||0)+1;if(v.p==='web')save();
 const rx=db.rx[id]||{l:0,d:0,me:0},cms=db.cm[id]||[],ch=v.ch?chOf(v.ch):null;
 $('#app').innerHTML=`<div class="watch"><div>
 <div class="player" id="pl"></div><h2 style="margin:12px 0 4px">${esc(v.title)}</h2>
 <div class="m">${v.views}x ditonton • ${v.p}</div>
 <div class="row">${ch?`<a href="#ch-${ch.id}"><b>${esc(ch.name)}</b></a>`:`<b>${esc(v.chName||v.p)}</b>`}
  ${ch?`<button id="sb" class="${db.sub[ch.id]?'':'on'}" onclick="subs('${ch.id}')">${db.sub[ch.id]?'Berlangganan ✓':'Subscribe'}</button>`:''}
  <span style="flex:1"></span>
  <button onclick="react('${id}',1)">${rx.me===1?'👍':'👍'} ${rx.l}</button><button onclick="react('${id}',-1)">👎 ${rx.d}</button>
  <button onclick="share('${id}')">↗ Bagikan</button></div>
 <p class="m">${esc(v.desc||'')}</p>
 <h3>${cms.length} Komentar</h3>
 <div class="row"><input id="ci" placeholder="Tulis komentar..." style="flex:1;margin:0"><button class="p" onclick="addCm('${id}')">Kirim</button></div>
 <div id="cl">${cms.map(c=>`<div class="cm"><div class="av">${esc(c.u[0]||'?').toUpperCase()}</div><div><b>${esc(c.u)}</b> <span class="m">${new Date(c.ts).toLocaleString('id-ID')}</span><div>${esc(c.t)}</div></div></div>`).join('')}</div>
 </div><div><h3>Video lain</h3><div class="grid" style="grid-template-columns:1fr">${allVids().filter(x=>x.id!==id).slice(0,10).map(card).join('')}</div></div></div>`;
 startAd(v)}
function startAd(v){const pl=$('#pl');let s=AD_SECONDS;
 pl.innerHTML=`<div class="ad" id="ad"><span class="tag" style="position:static">Iklan</span><div id="adc">${AD_HTML||'<h2>🎮 Tempat Iklan</h2><div class="m">Pasang kode iklan jaringan iklan kamu di AD_HTML</div>'}</div>
 <div class="m" id="at">Video mulai dalam ${s}d</div><button id="sk" style="display:none" class="p">Lewati Iklan ▶</button></div>`;
 const go=done=>{clearInterval(adTimer);if(done)reward(v);play(v)};
 $('#sk').onclick=()=>go(true);
 clearInterval(adTimer);adTimer=setInterval(()=>{s--;if(s>0)$('#at').textContent=`Video mulai dalam ${s}d`;else{$('#at').textContent='Iklan selesai';$('#sk').style.display='';clearInterval(adTimer)}},1000)}
function reward(v){if(v.p!=='web'||!v.ch)return;const e=db.earn[v.ch]||(db.earn[v.ch]={ads:0,rp:0,paid:0});e.ads++;e.rp+=REWARD_PER_AD;save()}
async function play(v){const pl=$('#pl');if(!pl)return;
 if(v.p==='web'){const b=await idbp('get','f_'+v.id);if(!b){pl.innerHTML='<div class="ad">File video tidak ada di browser ini (demo: file disimpan lokal).</div>';return}
  pl.innerHTML=`<video controls autoplay src="${URL.createObjectURL(b)}"></video>`}
 else pl.innerHTML=`<iframe src="${embed(v)}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`}
function react(id,x){const r=db.rx[id]||(db.rx[id]={l:0,d:0,me:0});if(r.me===1)r.l--;if(r.me===-1)r.d--;
 if(r.me===x)r.me=0;else{r.me=x;x===1?r.l++:r.d++}save();const t=$('#pl').innerHTML;const keep=$('#pl');const p=keep.parentNode;
 const row=p.querySelector('.row');const bs=row.querySelectorAll('button');bs[bs.length-3].textContent='👍 '+r.l;bs[bs.length-2].textContent='👎 '+r.d}
function addCm(id){const t=$('#ci').value.trim();if(!t)return;(db.cm[id]||(db.cm[id]=[])).unshift({u:db.user,t,ts:Date.now()});save();watch(id).then(()=>{})}
function subs(cid){const c=chOf(cid);db.sub[cid]=!db.sub[cid];c.subs=Math.max(0,(c.subs||0)+(db.sub[cid]?1:-1));save();const b=$('#sb');if(b){b.textContent=db.sub[cid]?'Berlangganan ✓':'Subscribe';b.className=db.sub[cid]?'':'on'}else route()}
async function share(id){const u=location.href.split('#')[0]+'#w-'+id;
 if(navigator.share)try{await navigator.share({title:getV(id).title,url:u});return}catch(e){}
 try{await navigator.clipboard.writeText(u);alert('Link disalin:\n'+u)}catch(e){prompt('Salin link:',u)}}

/* ===== CHANNEL & PENGHASILAN ===== */
function chPage(id){const c=chOf(id);if(!c){$('#app').innerHTML='<p>Channel tidak ada.</p>';return}
 $('#app').innerHTML=`<div class="row"><div class="av" style="width:72px;height:72px;font-size:30px">${esc(c.name[0])}</div><div><h2 style="margin:0">${esc(c.name)}</h2>
 <div class="m">${c.subs||0} subscriber • ${db.vid.filter(v=>v.ch===id).length} video</div><div class="m">${esc(c.desc)}</div>
 ${c.yt?`<div class="m">🔗 Terhubung ke YouTube: <a href="${esc(c.yt)}" target="_blank" rel="noopener" style="color:#6cf">${esc(c.yt)}</a></div>`:''}</div>
 <button class="${db.sub[id]?'':'on'}" onclick="subs('${id}')">${db.sub[id]?'Berlangganan ✓':'Subscribe'}</button>
 <button onclick="location.hash='ch-${id}';db.cur='${id}';save()">Pilih channel ini</button><button class="p" onclick="openCh()">+ Buat Channel</button></div>
 ${grid(db.vid.filter(v=>v.ch===id))}`}
function earnPage(){const c=chOf(db.cur),e=db.earn[db.cur]||{ads:0,rp:0,paid:0},bal=e.rp-e.paid;
 $('#app').innerHTML=`<h2>💰 Penghasilan — ${esc(c.name)}</h2>
 <div class="stat">Iklan ditonton<b>${e.ads}</b></div><div class="stat">Total pendapatan<b>${rp(e.rp)}</b></div><div class="stat">Saldo<b>${rp(bal)}</b></div>
 <p class="m">Pendapatan bertambah tiap penonton menyelesaikan iklan di video yang diupload ke channel ini.<br>⚠ Ini simulasi di browser. Untuk uang sungguhan kamu perlu server + jaringan iklan (mis. AdSense dengan ID penerbit ca-pub-...) dan sistem pembayaran.</p>
 <button class="p" onclick="if(${bal}<100000)alert('Minimal penarikan Rp 100.000 (simulasi)');else{db.earn['${db.cur}'].paid+=${bal};save();alert('Permintaan penarikan dicatat (simulasi).');earnPage()}">Tarik Saldo</button>`}

/* ===== MODAL ===== */
const modal=h=>{$('#md').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box">${h}</div></div>`};
const close=()=>{$('#md').innerHTML=''};
const chOpts=()=>db.ch.map(c=>`<option value="${c.id}" ${c.id===db.cur?'selected':''}>${esc(c.name)}</option>`).join('');
function openCh(){modal(`<h3>Buat Channel</h3>Nama channel<input id="n"> Deskripsi<textarea id="d"></textarea>
 Link channel YouTube asli (opsional, hanya untuk tautan)<input id="y" placeholder="${MY_YT}">
 <div class="row"><button class="p" onclick="saveCh()">Buat</button><button onclick="close()">Batal</button></div>`)}
function saveCh(){const n=$('#n').value.trim();if(!n)return alert('Isi nama');const c={id:'c'+uid(),name:n,desc:$('#d').value,yt:$('#y').value.trim(),subs:0};db.ch.push(c);db.cur=c.id;save();close();location.hash='ch-'+c.id}
function openUp(){modal(`<h3>Upload Video ke IceTube</h3>Channel<select id="uc">${chOpts()}</select>
 File video<input id="uf" type="file" accept="video/*">Judul<input id="ut">Deskripsi<textarea id="ud"></textarea>
 <div class="m">Video hanya tersimpan di IceTube (tidak dikirim ke YouTube).</div>
 <div class="row"><button class="p" id="ub" onclick="doUp()">Upload</button><button onclick="close()">Batal</button></div>`)}
async function doUp(){const f=$('#uf').files[0],t=$('#ut').value.trim();if(!f||!t)return alert('Pilih file dan isi judul');
 $('#ub').textContent='Memproses...';const id='v'+uid();await idbp('put','f_'+id,f);
 const img=await new Promise(r=>{const v=document.createElement('video');v.muted=true;v.src=URL.createObjectURL(f);v.onloadeddata=()=>v.currentTime=Math.min(1,v.duration/2);
  v.onseeked=()=>{const c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(v,0,0,320,180);r(c.toDataURL('image/jpeg',.6))};v.onerror=()=>r('')});
 db.vid.unshift({id,p:'web',title:t,desc:$('#ud').value,ch:$('#uc').value,img,views:0,ts:Date.now()});save();close();location.hash='w-'+id}
function openAdd(){modal(`<h3>Tambah Video dari Link</h3>Link YouTube / TikTok / Instagram / Dailymotion<input id="al" placeholder="https://...">
 Judul<input id="at2">Channel<select id="ac">${chOpts()}</select>
 <div class="row"><button class="p" onclick="doAdd()">Tambah</button><button onclick="close()">Batal</button></div>`)}
function doAdd(){const p=parse($('#al').value);if(!p)return alert('Link tidak dikenali');const id='v'+uid();
 db.vid.unshift({id,...p,title:$('#at2').value||('Video '+p.p),ch:$('#ac').value,views:0,ts:Date.now()});save();close();location.hash='w-'+id}
function openSet(){modal(`<h3>Pengaturan</h3>Nama tampilan (untuk komentar)<input id="su" value="${esc(db.user)}">
 YouTube Data API key (untuk memuat semua video & trending)<input id="sk2" value="${esc(db.key)}">
 ID channel YouTube (UC...) — alternatif tanpa API key<input id="si" value="${esc(db.ytId)}">
 <div class="row"><button class="p" onclick="db.user=$('#su').value||'Pengguna';db.key=$('#sk2').value.trim();db.ytId=$('#si').value.trim();save();close();route()">Simpan</button>
 <button onclick="if(confirm('Hapus semua data lokal?')){localStorage.removeItem('icetube');location.reload()}">Reset</button></div>`)}
route();
</script></body></html>
